<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NCFB Шифратор</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background: #f9f9f9;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    button {
      background: #3498db;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 10px;
    }
    button:hover {      background: #2980b9;
    }
    .result {
      background: white;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .warning {
      color: #e74c3c;
      font-size: 14px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>🔐 NCFB — Нелинейный Шифр с Обратной Связью</h1>

  <div class="form-group">
    <label for="key">Ключ (минимум 8 символов рекомендуется):</label>
    <input type="password" id="key" placeholder="Введите секретный ключ" value="mysecretkey123" />
    <div class="warning">⚠️ Сохраните ключ! Без него расшифровка невозможна.</div>
  </div>

  <div class="form-group">
    <label for="input">Исходный текст:</label>
    <textarea id="input" placeholder="Введите текст для шифрования или расшифровки">Привет, мир! 😊 Это секретное сообщение.</textarea>
  </div>

  <button onclick="encrypt()">Зашифровать</button>
  <button onclick="decrypt()">Расшифровать</button>

  <div class="form-group">
    <label>Результат:</label>
    <div class="result" id="output">Результат появится здесь...</div>
  </div>

  <script>
    // Модуль 2^256
    const MOD = 1n << 256n;

    // Преобразование строки в Uint8Array (UTF-8)
    function strToBytes(str) {
      return new TextEncoder().encode(str);
    }

    // Преобразование Uint8Array в строку
    function bytesToStr(bytes) {      return new TextDecoder().decode(bytes);
    }

    // Хеширование ключа в начальное состояние (нелинейно)
    function initStateFromKey(keyBytes) {
      let state = 0n;
      for (let i = 0; i < keyBytes.length; i++) {
        const val = BigInt(keyBytes[i] + 1);
        // Нелинейность: степень = i+2
        let power = val;
        for (let p = 1; p < i + 2; p++) {
          power = (power * val) % MOD;
        }
        state = (state + power) % MOD;
      }
      return state;
    }

    // NCFB шифрование
    function ncrypt(dataBytes, keyBytes, isEncrypt = true) {
      if (keyBytes.length === 0) throw new Error("Ключ не может быть пустым");
      
      let state = initStateFromKey(keyBytes);
      const result = new Uint8Array(dataBytes.length);
      let prevCipher = 0; // C_{-1} = 0

      for (let i = 0; i < dataBytes.length; i++) {
        // a_i = (prevCipher + 1) mod 256
        const a = BigInt((prevCipher + 1) & 0xFF);
        // b_i = key[i mod L] + 1
        const b = BigInt(keyBytes[i % keyBytes.length] + 1);

        // Нелинейное обновление состояния: S = S^3 + a*S + b (mod 2^256)
        const S_sq = (state * state) % MOD;
        const S_cu = (S_sq * state) % MOD;
        const aS = (a * state) % MOD;
        state = (S_cu + aS + b) % MOD;

        // Извлекаем i-й байт состояния (младшие байты)
        const keystreamByte = Number((state >> BigInt(8n * BigInt(i % 32n))) & 0xFFn);

        if (isEncrypt) {
          result[i] = dataBytes[i] ^ keystreamByte;
          prevCipher = result[i];
        } else {
          const plainByte = dataBytes[i] ^ keystreamByte;
          result[i] = plainByte;
          prevCipher = dataBytes[i]; // важно: используем входной шифротекст!
        }
      }      return result;
    }

    function encrypt() {
      try {
        const key = document.getElementById('key').value;
        const input = document.getElementById('input').value;
        if (!key) {
          alert("Введите ключ!");
          return;
        }
        const keyBytes = strToBytes(key);
        const dataBytes = strToBytes(input);
        const encryptedBytes = ncrypt(dataBytes, keyBytes, true);
        
        // Кодируем в Base64 для удобного отображения
        const encryptedB64 = btoa(String.fromCharCode(...encryptedBytes));
        document.getElementById('output').textContent = encryptedB64;
      } catch (e) {
        document.getElementById('output').textContent = "Ошибка: " + e.message;
      }
    }

    function decrypt() {
      try {
        const key = document.getElementById('key').value;
        const inputB64 = document.getElementById('input').value;
        if (!key) {
          alert("Введите ключ!");
          return;
        }
        const keyBytes = strToBytes(key);
        // Декодируем из Base64
        const binary = atob(inputB64);
        const dataBytes = new Uint8Array(binary.split('').map(c => c.charCodeAt(0)));
        const decryptedBytes = ncrypt(dataBytes, keyBytes, false);
        const decryptedText = bytesToStr(decryptedBytes);
        document.getElementById('output').textContent = decryptedText;
      } catch (e) {
        document.getElementById('output').textContent = "Ошибка расшифровки: " + e.message + "\n\nУбедитесь, что введён корректный шифротекст (Base64) и правильный ключ.";
      }
    }
  </script>
</body>
</html>
