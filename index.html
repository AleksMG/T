<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PPS v4.0 — Pure Power Stream</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background: #f9f9f9;
      color: #333;
    }
    h1 { text-align: center; color: #2c3e50; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input, textarea {
      width: 100%; padding: 10px; border: 1px solid #ccc;
      border-radius: 6px; font-size: 15px; box-sizing: border-box;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      background: #e74c3c; color: white; border: none;
      padding: 12px 24px; font-size: 16px; border-radius: 6px;
      cursor: pointer; margin-right: 10px;
    }
    button:hover { background: #c0392b; }
    .result {
      background: white; border: 1px solid #ddd; padding: 15px;
      border-radius: 6px; white-space: pre-wrap; word-break: break-word;
    }
    .warning { color: #e74c3c; font-size: 14px; margin-top: 5px; }
  </style>
</head>
<body>
  <h1>🔥 PPS v4.0 — Pure Power Stream (идеальный)</h1>

  <div class="form-group">
    <label for="key">Ключ (≥16 символов):</label>
    <input type="password" id="key" value="my_secret_key_2026!" />
    <div class="warning">⚠️ Сохраните ключ! Без него расшифровка невозможна.</div>
  </div>

  <div class="form-group">
    <label for="input">Текст:</label>
    <textarea id="input">Секретное сообщение с эмодзи 😊🔒!</textarea>
  </div>

  <button onclick="encrypt()">Зашифровать</button>
  <button onclick="decrypt()">Расшифровать</button>

  <div class="form-group">
    <label>Результат:</label>
    <div class="result" id="output">...</div>
  </div>

  <script>
    // Большое простое число: 2^255 - 19
    const P = (1n << 255n) - 19n;
    const MIN_PARAM = 1n << 192n; // Минимальный размер параметров

    // Быстрое возведение в степень
    function modPow(base, exp, mod) {
      if (exp === 0n) return 1n;
      let result = 1n;
      base %= mod;
      while (exp > 0n) {
        if (exp & 1n) result = (result * base) % mod;
        exp >>= 1n;
        base = (base * base) % mod;
      }
      return result;
    }

    // Преобразование
    const te = new TextEncoder();
    const td = new TextDecoder();
    function strToBytes(s) { return te.encode(s); }
    function bytesToStr(b) { return td.decode(b); }

    // Сильная защита параметров
    function ensureMin(x) {
      while (x < MIN_PARAM) {
        x = modPow(x * 0x10001n + 1n, 3n, P);
      }
      return x;
    }

    // Нелинейное смешивание ключа
    function deriveParams(keyBytes) {
      let d = 0n, K = 0n;
      for (let i = 0; i < keyBytes.length; i++) {
        const b = BigInt(keyBytes[i]);
        d = (d * 257n + b + modPow(b + 17n, 3n, P)) % (P - 1n);
        K = (K * 257n + b + modPow(b + 19n, 5n, P)) % P;
      }
      d = (d | 1n) % (P - 1n);
      return { d: ensureMin(d), K: ensureMin(K) };
    }

    // НЕЛИНЕЙНОЕ ПЕРЕМЕШИВАНИЕ (только степенные функции)
    function nonlinearMix(x, K) {
      x = modPow(x, 3n, P);
      x = (x * K) % P;
      x = modPow(x, 5n, P);
      return x;
    }

    // ИДЕАЛЬНЫЙ EXTRACTOR (полноширинные экспоненты)
    function extractKeystream(S, K) {
      // Полноширинные динамические экспоненты
      const e1 = (K ^ S ^ (K >> 128n) ^ (S >> 64n)) | 1n;
      const e2 = ((K * S) % (P - 1n)) | 1n;
      const e3 = modPow(K ^ S, 3n, P - 1n) | 1n;
      
      let T = modPow(S, e1, P);
      T = modPow((T + S) % P, e2, P);
      T = modPow(T ^ S, e3, P);
      T = nonlinearMix(T, K); // Дополнительное нелинейное перемешивание
      
      // Возвращаем 256 бит (все состояние)
      return [
        Number(T & 0xFFFFFFFFFFFFFFFFn),
        Number((T >> 64n) & 0xFFFFFFFFFFFFFFFFn),
        Number((T >> 128n) & 0xFFFFFFFFFFFFFFFFn),
        Number((T >> 192n) & 0xFFFFFFFFFFFFFFFFn)
      ];
    }

    // ЦИКЛИЧЕСКАЯ ОБРАТНАЯ СВЯЗЬ
    function cyclicShift(value, shift, width) {
      shift = shift % width;
      return ((value << shift) | (value >> (width - shift))) & ((1n << width) - 1n);
    }

    // 10 РАУНДОВ ИДЕАЛЬНОЙ НЕЛИНЕЙНОЙ ДИНАМИКИ
    function nonlinearRound(state, K, feedback, d) {
      let s = state;
      const FEEDBACK_WIDTH = 256n;
      
      for (let r = 0; r < 10; r++) {
        // Полноширинная динамическая экспонента
        const exp = (d ^ (K >> (BigInt(r) * 25n))) | 1n;
        s = modPow(s, exp, P);
        
        // Циклический сдвиг вместо арифметического
        const shift = BigInt(r) * 25n;
        const shiftedFeedback = cyclicShift(feedback, shift, FEEDBACK_WIDTH);
        s = (s + (K * shiftedFeedback) % P) % P;
        
        // Защита от малых состояний
        if (s < MIN_PARAM) {
          s = (s * 0x10001n + K) % P;
        }
      }
      return s;
    }

    function process(dataBytes, keyBytes, isEncrypt) {
      if (keyBytes.length === 0) throw new Error("Ключ пуст");
      
      const { d, K } = deriveParams(keyBytes);
      let state = (K + 1n) % P;
      const result = new Uint8Array(dataBytes.length);
      let prevCipher256 = 0n; // 256-битный обратный шифротекст

      for (let i = 0; i < dataBytes.length; i += 32) {
        state = nonlinearRound(state, K, prevCipher256, d);
        const [b0, b1, b2, b3] = extractKeystream(state, K);
        const keystream256 = 
          (BigInt(b3) << 192n) | 
          (BigInt(b2) << 128n) | 
          (BigInt(b1) << 64n) | 
          BigInt(b0);

        let cipher256 = 0n;
        for (let j = 0; j < 32 && (i + j) < dataBytes.length; j++) {
          const plainByte = dataBytes[i + j];
          const ksByte = Number((keystream256 >> (BigInt(j) * 8n)) & 0xFFn);
          const cipherByte = plainByte ^ ksByte;
          result[i + j] = cipherByte;
          
          if (isEncrypt) {
            cipher256 |= BigInt(cipherByte) << (BigInt(j) * 8n);
          } else {
            cipher256 |= BigInt(dataBytes[i + j]) << (BigInt(j) * 8n);
          }
        }
        prevCipher256 = cipher256;
      }
      return result;
    }

    // Base64
    function toBase64(bytes) {
      let bin = '';
      for (const b of bytes) bin += String.fromCharCode(b);
      return btoa(bin);
    }
    function fromBase64(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    // Интерфейс
    function encrypt() {
      try {
        const key = document.getElementById('key').value;
        const input = document.getElementById('input').value;
        if (!key.trim()) return alert("Введите ключ!");
        const out = toBase64(process(strToBytes(input), strToBytes(key), true));
        document.getElementById('output').textContent = out;
      } catch (e) {
        console.error(e);
        document.getElementById('output').textContent = "Ошибка: " + e.message;
      }
    }

    function decrypt() {
      try {
        const key = document.getElementById('key').value;
        const b64 = document.getElementById('input').value.trim();
        if (!key.trim() || !b64) return alert("Введите ключ и шифротекст!");
        const out = bytesToStr(process(fromBase64(b64), strToBytes(key), false));
        document.getElementById('output').textContent = out;
      } catch (e) {
        console.error(e);
        document.getElementById('output').textContent = 
          "Ошибка расшифровки:\n" + e.message +
          "\n\nУбедитесь, что ключ и шифротекст верны.";
      }
    }
  </script>
</body>
</html>
